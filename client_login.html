<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GoPay - Login</title>
  <link rel="stylesheet" href="client_login.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <div class="login-container">
    <div class="logo-section">
      <img src="gopay-icon.png" alt="GoPay Logo" class="login-logo" />
      <h2 class="login-title">Welcome to GoPay</h2>
    </div>

    <form class="login-form" action="/login" method="POST">
  <div class="input-group">
    <label for="username"><i class="fas fa-user"></i> User Name</label>
    <input type="text" id="username" name="username" placeholder="Enter your username" required />
  </div>

  <div class="input-group">
    <label for="phone"><i class="fas fa-phone"></i> Phone Number</label>
    <input type="tel" id="phone" name="phone" placeholder="+237 6XX XXX XXX" pattern="^\+?[0-9\s]{7,15}$" required />
  </div>

  <button type="submit" class="login-btn">Login</button>
</form>

  </div>
</body>
</html>
