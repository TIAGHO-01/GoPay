<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Profil du Conducteur</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .profile-container {
            max-width: 600px;
            margin: auto;
            background: #fff;
            padding: 30px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 10px;
            text-align: center;
        }

        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #4CAF50;
            margin-bottom: 20px;
        }

        .info {
            text-align: left;
            margin-top: 20px;
        }

        .info p {
            font-size: 18px;
            margin: 10px 0;
        }

        .qr-code {
            margin-top: 30px;
        }

        .qr-code img {
            width: 200px;
        }
    </style>
</head>
<body>

<div class="profile-container">
    <img src="https://via.placeholder.com/150" alt="Photo du Conducteur" class="profile-pic">
    <h2>Nom du Conducteur</h2>

    <div class="info">
        <p><strong>Numéro de téléphone :</strong> +225 07 00 00 00</p>
        <p><strong>Matricule :</strong> AB-123-CD</p>
        <p><strong>Casier judiciaire :</strong> ✅ Vierge</p>
    </div>

    <div class="qr-code">
        <h3>QR Code - Moyen de Paiement</h3>
        <img src="https://api.qrserver.com/v1/create-qr-code/?data=GoPay-123456789&size=200x200" alt="QR Code Paiement">
    </div>
</div>

</body>
</html>
