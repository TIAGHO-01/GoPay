<!-- Trigger rebuild -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoPay - Client Page</title>
  <link rel="stylesheet" href="main.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <div class="container">

    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <img src="gopay-icon.png" alt="GoPay Logo" class="logo" />
      </div>
      <div class="header-icons">
        <i class="fas fa-search"></i>
        <i class="fas fa-bell"></i>
        <i class="fas fa-circle-question"></i>
      </div>
    </div>

    <!-- QR/Driver Frame -->
    <div class="qr-frame" id="qrFrame">
      <p>Scan QR to get driver info</p>
    </div>

    <!-- From - To Destination Fields -->
    <div class="location-fields">
      <input type="text" placeholder="From" class="location-input" />
      <input type="text" placeholder="To" class="location-input" />
    </div>

    <!-- MoMo Buttons -->
    <div class="momo-buttons">
      <button class="momo-btn orange">Orange Money</button>
      <button class="momo-btn mtn">MTN MoMo</button>
    </div>

    <!-- Fare Input -->
    <div class="fare-input">
      <input type="text" placeholder="Enter Fare" />
    </div>

    <button class="make-payment-btn">Make Payment</button>

  </div>

  <!-- Footer -->
  <div class="footer">
    <i class="fas fa-cog"></i>
    <i class="fas fa-home active"></i>
    <i class="fas fa-user"></i>
  </div>
</body>
</html>
