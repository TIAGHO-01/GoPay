<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Récap de transaction</title>
  <link rel="stylesheet" href="transaction_recap.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <i class="fas fa-arrow-left"></i>
      <h1>Transaction Recap</h1>
      <div></div>
    </div>

    <!-- Offer Summary -->
    <div class="card">
      <div class="product-info">
        <i  class="fas fa-user-circle"></i>
        <div>
          <h2>Driver MAT</h2>
          <p class="subtext">CMRTH2942</p>
        </div>
      </div>
      <div class="info-line">
        <span>Pickup location</span>
        <span class="strong">Damas</span>
      </div>
      <div class="info-line">
        <span>Drop-off location</span>
        <span class="strong2">Mokolo</span>
      </div>
    </div>

    <!-- Payment Method -->
    <div class="card">
      <div class="section-title">Payment Method :</div>
      <div class="payment-method">
        <i class="fas fa-money-bill"></i>
        <div class="payment-details">
          <span class="method-name">Orange</span>
          <span class="stars">••••••</span>
        </div>
        <i class="fas fa-eye"></i>
        <a class="change-btn" href="#">Change <i class="fas fa-chevron-right"></i></a>
      </div>
      <hr />
      <div class="info-line">
        <span>Tell</span>
        <span>655467927</span>
      </div>
      <div class="info-line total">
        <span>Fare</span>
        <span>200 U</span>
      </div>
    </div>

    <!-- Confirm Button -->
    <button class="confirm-btn">Confirmer</button>
  </div>


<script>
  const transaction = JSON.parse(localStorage.getItem('gopay_transaction'));

  if (transaction) {
    document.querySelector('h2').textContent = 'Driver MAT';
document.querySelector('.subtext').textContent = transaction.driverMatricule;

document.querySelector('.info-line .strong').textContent = transaction.from;
document.querySelector('.info-line .strong2').textContent = transaction.to;

document.querySelector('.method-name').textContent = transaction.paymentMethod;

// FIX: Correct selector for the "Tell" section
document.querySelectorAll('.info-line')[2].querySelector('span:last-child').textContent = transaction.driverPhone;

// FIX: Fare section remains fine
document.querySelector('.total span:last-child').textContent = `${transaction.fare} U`;

  }
</script>

<script>
  document.querySelector('.confirm-btn').addEventListener('click', () => {
    localStorage.removeItem('gopay_transaction');
    alert('Transaction confirmed!');
    // Optionally redirect to another page
    // window.location.href = 'thank_you.html';
  });
</script>


</body>
</html>
