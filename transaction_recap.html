<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Transaction Recap</title>
  <link rel="stylesheet" href="transaction_recap.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

<div class="main-container">

  <!-- Header -->
  <div class="header">
    <img src="gopay-icon.png" alt="GoPay Logo" class="logo" />
    <div class="header-icons">
      <i class="fas fa-search"></i>
      <i class="fas fa-bell"></i>
      <i class="fas fa-circle-question"></i>
    </div>
  </div>

  <!-- Recap Card -->
  <div class="recap-card">
    <h2 class="recap-title">Trip Recap</h2>

    <div class="recap-section">
      <div class="recap-row">
        <div class="label">Trip Type</div>
        <div class="value">Giganight</div>
      </div>
      <div class="recap-row">
        <div class="label">Data</div>
        <div class="value">2 Go</div>
      </div>
      <div class="recap-row">
        <div class="label">Period</div>
        <div class="value">Night</div>
      </div>
    </div>

    <div class="recap-section">
      <div class="recap-row">
        <div class="label">Payment Method</div>
        <div class="value method">
          <span class="momo orange">Orange Money</span>
          <a href="#" class="change-link">Change</a>
        </div>
      </div>
      <div class="recap-row">
        <div class="label">Amount</div>
        <div class="value">200 U</div>
      </div>
    </div>

    <div class="total-row">
      <span>Total</span>
      <strong>200 U</strong>
    </div>

    <button class="confirm-btn">Confirm</button>
  </div>
</div>

</body>
</html>
