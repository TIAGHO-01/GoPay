<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Récap de transaction</title>
  <link rel="stylesheet" href="transaction_recap.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <i class="fas fa-arrow-left"></i>
      <h1>Récap de transaction</h1>
      <div></div>
    </div>

    <!-- Offer Summary -->
    <div class="card">
      <div class="product-info">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/8b/2GO_logo.png" alt="Offer Icon" />
        <div>
          <h2>Giganight</h2>
          <p class="subtext">2 Go</p>
        </div>
      </div>
      <div class="info-line">
        <span>Période</span>
        <span class="strong">Night</span>
      </div>
    </div>

    <!-- Payment Method -->
    <div class="card">
      <div class="section-title">Méthode de paiement :</div>
      <div class="payment-method">
        <img src="https://upload.wikimedia.org/wikipedia/commons/3/3d/Orange_logo.svg" alt="Orange" />
        <div class="payment-details">
          <span class="method-name">Orange</span>
          <span class="stars">••••••</span>
        </div>
        <i class="fas fa-eye"></i>
        <a class="change-btn" href="#">Changer <i class="fas fa-chevron-right"></i></a>
      </div>
      <hr />
      <div class="info-line">
        <span>Montant</span>
        <span>200 U</span>
      </div>
      <div class="info-line total">
        <span>Total</span>
        <span>200 U</span>
      </div>
    </div>

    <!-- Confirm Button -->
    <button class="confirm-btn">Confirmer</button>
  </div>
</body>
</html>
